syntax = "proto3";

// 시간 처리를 위한 구글 라이브러리 임포트
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.shadowfit.grpc";
option java_outer_classname = "ExerciseProto";

// [Service] 운동 분석 및 세션 관리 서비스
service ExerciseService {

  // [추가] 등록 단계: 유튜브 링크를 주면 전체 좌표를 반환 (Spring -> FastAPI)
  rpc ExtractReferenceData (ExtractRequest) returns (ExtractResponse);

  // [수정] 실행 단계: 세션 정보와 함께 'DB에 저장된 기준 좌표'를 전달 (Spring -> FastAPI)
  rpc StartAnalysis (AnalyzeRequest) returns (AnalyzeResponse);

  // 재부착: 이미 IN_PROGRESS 인 세션의 AI 상태를 DB 값으로 되살린다 (Spring -> FastAPI).
  // StartAnalysis 와 분리한 이유 — 이 RPC 는 '상태가 이미 있으면 보존하고 성공 반환'이 계약이라
  // 정상 시작 경로와 멱등 규칙이 정반대다. 한 핸들러에 섞으면 시작 요청이 조용히 no-op 이 될 수 있다.
  // (docs/decisions/session-resume-and-ai-state.md §4-B, 이슈 #59 2단계)
  rpc ReattachAnalysis (ReattachRequest) returns (ReattachResponse);

  // 3. 분석 결과 배치 저장 (FastAPI -> Spring)
  rpc SavePoseDataBatch (PoseDataBatchRequest) returns (PoseDataResponse);

  rpc CompleteAnalysis (SessionCompleteRequest) returns (SessionCompleteResponse);

  // ✅ 사용자가 운동을 중단했을 때 AI 서버에 알리는 명령
  rpc StopAnalysis (StopRequest) returns (StopResponse);

  // 4. TTS 피드백 발화 이벤트 batch 저장 (FastAPI -> Spring, BT-SET)
  rpc ReportFeedbackBatch (FeedbackBatchRequest) returns (FeedbackBatchResponse);
}

// ------------------------------------------------------------
// [공통] 세션 상태 정의
// ------------------------------------------------------------
enum SessionStatus {
  IN_PROGRESS = 0;
  COMPLETED = 1;
  FAILED = 2;
}

// ------------------------------------------------------------
// 1. 세션 시작 관련 메시지 (ExercisesRequestDto/ResponseDto 대응)
// ------------------------------------------------------------

// 1. 등록용 메시지
message ExtractRequest {
  int64 exercise_id = 1;
  string youtube_url = 2;
  repeated PoseDataRequest extracted_poses = 3; // <--- 요청에 리스트가 있어야 함!
}

message ExtractResponse {
  bool success = 1;
  int64 exercise_id = 2;
  repeated PoseDataRequest extracted_poses = 3; // 추출된 모든 프레임 좌표
}

message AnalyzeRequest {
  int64 exercise_id = 1;
  int64 session_id = 3;
  string reference_source = 2;
  // [핵심] 스프링 DB에서 조회한 기준 좌표 리스트를 여기에 담아서 보냅니다.
  repeated PoseDataRequest reference_poses = 4;
  // 페르소나별 싱크로율 임계값 계산용 (BEGINNER/ADVANCED/DIET/REHAB). 빈 문자열이면 AI측에서 BEGINNER로 취급.
  string persona = 5;
}

message AnalyzeResponse {
  bool success = 1;
  int64 session_id = 2;
  int64 exercise_id = 3;
  google.protobuf.Timestamp start_time = 4; // 시작 시간 (LocalDateTime 대용)
  SessionStatus status = 5;                 // 세션 상태
}

// 1-2. 재부착용 메시지 (이슈 #59 2단계)
message ReattachRequest {
  int64 exercise_id = 1;
  int64 session_id = 2;
  // StartAnalysis 와 동일하게 Spring 이 DB 에서 읽어 채워준다 — AI 는 기준 좌표를 보관하지 않는다.
  repeated PoseDataRequest reference_poses = 3;
  string persona = 4;
  // pose_data 의 MAX(rep_number). AI 는 여기서부터 이어서 센다.
  // 이 값이 없으면 재부착 후 total_reps 가 재부착 이후분만 집계된다(CompleteAnalysis 가 AI 값을 그대로 쓰므로).
  int32 initial_rep_count = 5;
  // 세션 시작(session.start_time)부터 재부착 시점까지 이미 흐른 초 (이슈 #156).
  // AI 는 프레임 시각을 «자기 단조시계 기준 경과» 로 만드는데, 재부착하면 그 기준이 재부착
  // 시점으로 리셋된다. 이 값이 없으면 재부착 이후 프레임의 timestamp_sec 이 0 부터 다시 시작해
  // 리포트의 시각 표시가 뒤로 감는다. initial_rep_count 가 rep 축에서 하는 일을 시간 축에서 한다.
  double elapsed_sec = 6;
}

message ReattachResponse {
  bool success = 1;
  int64 session_id = 2;
  // 재부착 후 AI 가 이어서 셀 기준 rep 수. already_active 면 살아있던 상태의 현재 값이다.
  int32 rep_count = 3;
  // true = AI 상태가 이미 살아있어 아무것도 하지 않았다(멱등 경로).
  // 중복 호출·네트워크 재시도로 진행 중이던 rep 과 스무딩 이력이 날아가는 것을 막는다.
  bool already_active = 4;
  string message = 5;
}

// ------------------------------------------------------------
// 2. 세션 종료 관련 메시지 (PUT /complete 대응)
// ------------------------------------------------------------

message SessionCompleteRequest {
  int64 session_id = 1;
  int32 total_reps = 2;       // 총 횟수
  double avg_sync_rate = 3;   // 평균 일치율
  double max_sync_rate = 4;   // 최대 일치율
  double min_sync_rate = 5;   // 최소 일치율
  double calories_burned = 6; // 소모 칼로리
  int32 difficulty_level = 7; // 난이도
}

message SessionCompleteResponse {
  int64 session_id = 1;
  SessionStatus status = 2;
  google.protobuf.Timestamp end_time = 3;   // 종료 시간
}

// ------------------------------------------------------------
// 3. 기존 데이터 저장 관련 메시지 (유지)
// ------------------------------------------------------------

message PoseDataRequest {
  double timestamp_sec = 1;
  string joint_coordinates = 2;
  double sync_rate = 3;
  string feedback_message = 4;
  // 이 프레임이 속한 rep 번호 (1-based). 재부착 시 MAX(rep_number) 로 rep 카운트를 복원하는 근거다.
  // sync_rate 연속구간으로 rep 을 추측하면 인접 rep 의 sync_rate 가 같을 때 병합돼 undercount 된다
  // (docs/decisions/session-resume-and-ai-state.md §3-3).
  // reference_poses / extracted_poses 로 쓰일 때는 rep 개념이 없어 0 이다.
  int32 rep_number = 5;
  // 좌우 무릎각 평균을 최근 3프레임으로 평활한 값(도). 작을수록 깊게 앉은 것이다.
  // sync_rate 는 rep 단위로 채점돼 프레임마다 복제되므로 rep 안에서 상수다 — 즉 "이 rep 의
  // 어느 순간이 바닥이었나"를 sync_rate 로는 고를 수 없다. 그런데 joint_coordinates 는 프레임마다
  // 다르므로 어느 프레임을 남기느냐가 리포트에 그려질 자세를 결정한다. Spring 이 다운샘플에서
  // 남길 프레임과 리포트 대표 프레임을 고르는 기준이 이 값이다
  // (docs/decisions/worst-section-rep-resolution.md §4-ㄹ).
  //
  // 정의는 rep 경계를 판정하는 값과 같다 — 그래야 "이 rep 의 바닥"과 "가장 깊은 프레임"이 어긋나지
  // 않는다. 평활값인 것은 의도적이다: 랜드마크가 한 프레임 튀면 그 프레임이 대표로 뽑혀 이상한
  // 뼈대가 리포트에 그려진다.
  //
  // proto3 라 구버전 AI(미전송)에서는 0 이 온다. 0 은 "미상"이며 유효한 각도값이 아니다
  // (스쿼트 무릎각은 0 이 될 수 없다) — Spring 은 0 인 프레임을 대표 후보에서 제외하고
  // 기존처럼 중앙 프레임으로 떨어진다. reference_poses / extracted_poses 로 쓰일 때도 0 이다.
  double smoothed_knee_angle = 6;
}

message PoseDataBatchRequest {
  int64 session_id = 1;
  repeated PoseDataRequest pose_data = 2;
}

message PoseDataResponse {
  bool success = 1;
  int64 session_id = 2;
  double timestamp_sec = 3;
  string joint_coordinates = 4;
}

message StopRequest {
  int64 session_id = 1;
}

message StopResponse {
  bool success = 1;
  string message = 2;
  int64 session_id = 3;
}

// ------------------------------------------------------------
// 4. TTS 피드백 batch (BT-SET, 분기 2.A.BT)
// AI 가 세트 경계마다 또는 세션 종료 시점에 발화 이벤트를 묶어 보낸다.
// 멱등성: Spring 측 uniqueKey (session_id, occurred_at, feedback_type) +
// INSERT IGNORE 로 retry 안전.
// ------------------------------------------------------------

message FeedbackEvent {
  string feedback_type = 1;                    // 8종 enum 중 하나 (KNEE_OUT 등)
  double sync_rate_at_trigger = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message FeedbackBatchRequest {
  int64 session_id = 1;
  int32 set_no = 2;                            // 1-based. BT-NONE 호환 시 1 고정
  bool is_final = 3;                           // 마지막 batch 여부
  repeated FeedbackEvent events = 4;
}

message FeedbackBatchResponse {
  int64 session_id = 1;
  int32 saved_count = 2;                       // INSERT 된 row 수 (중복 흡수 제외)
}